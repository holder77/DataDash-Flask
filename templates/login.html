<!-- DEVELOPER 4: Tells Flask to wrap this specific page inside base.html -->
{% extends 'base.html' %}

<!-- Everything between here and endblock gets injected into base.html -->
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <h1 class="mb-4">Welcome to DataDash</h1>
        <div class="card shadow-sm p-4">
            
            <!-- 
                DEVELOPER 2 & 3: This form sends a GET request to the /dashboard route right now.
                Later, you will change this to POST and write the logic to validate the password.
            -->
            <form action="/dashboard" method="GET">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Username (Coming Soon)" disabled>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Password" disabled>
                </div>
                <!-- Temporarily acts as a skip button to jump straight to the dashboard -->
                <button type="submit" class="btn btn-primary w-100">Enter App</button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
