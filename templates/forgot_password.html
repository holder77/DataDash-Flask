{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        
        <div class="text-center mb-5 mt-4">
            <h1 class="pixel-font title-green" style="font-size: 28px;">System Restore</h1>
        </div>

        <div class="card auth-card p-4">
            <h3 class="pixel-font header-blue text-center mb-4 mt-2" style="font-size: 20px;">Recovery</h3>
            <p class="text-light text-center mb-4" style="font-size: 14px;">Enter your account email and we will dispatch recovery instructions.</p>
            
            <form action="/forgot-password" method="POST">
                <div class="mb-4 text-start">
                    <label class="form-label auth-label">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn btn-pixel btn-pixel-gray w-100 py-3 mb-3">Send Reset Link</button>
            </form>
            
            <div class="text-center mt-2">
                <a href="/" class="auth-link">Abort & Return</a>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
