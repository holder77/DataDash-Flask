{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <h1 class="mb-4">Create an Account</h1>
        
        <!-- Flash Messages for Errors/Success -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="card shadow-sm p-4">
            <form action="/register" method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Email (for password recovery)</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">Register Account</button>
            </form>
            <div>
                <a href="/" class="text-decoration-none">Already have an account? Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
