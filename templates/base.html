<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataDash</title>
    
    <!-- DEVELOPER 4: Bootstrap 5 CDN. This single line applies all the clean CSS styling globally. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Links the style sheet to customize the whole website -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- This line adds the tab icon -->
    <link rel="icon" href="{{ url_for('static', filename='dataman.jpg') }}" type="image/jpg">

    <!-- Google Font Emebed Code - Press Start 2p & IBM Plex Sans Arabic-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body >
    <!-- The container keeps everything centered with nice margins on wide screens -->
    <div class="container mt-5">
        <!-- 
            DEVELOPER 4: This is Jinja syntax. 
            Other HTML files will "inject" their specific code right here, 
            so we don't have to rewrite the <head> or Bootstrap links on every page.
        -->
        {% block content %}{% endblock %}
    </div>
</body>
</html>
